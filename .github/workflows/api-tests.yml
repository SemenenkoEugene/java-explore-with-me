name: Explore With Me API Tests

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        run: bash ./gradlew clean build -Pquality --no-daemon

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: yandex-praktikum/java-explore-with-me
          ref: main_svc
          path: api-tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install --global newman@6

      - name: Start services
        run: |
          docker compose up --build --detach
          bash .github/workflows/wait-for-it.sh -t 120 --strict localhost:8080
          bash .github/workflows/wait-for-it.sh -t 120 --strict localhost:9090

      - name: Run API tests
        run: |
          newman run api-tests/postman/ewm-main-service.json --delay-request 50
          newman run api-tests/postman/ewm-stat-service.json --delay-request 50
          newman run postman/feature.json --delay-request 50

      - name: Service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down
